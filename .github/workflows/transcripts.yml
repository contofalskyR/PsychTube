name: Fetch official transcripts
# Fetches the transcripts MIT OpenCourseWare and Open Yale Courses publish for lectures in the catalog
# (pipeline/transcripts.py plan -> pipeline/fetch_transcripts.py) and uploads them as a workflow artifact.
# Run by hand (workflow_dispatch); the build machine cannot reach those sites, this runner can.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N URLs (blank = all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python3 pipeline/transcripts.py plan
      - run: python3 pipeline/fetch_transcripts.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: |
            work/transcripts/checked.json
            work/transcripts/text/
            work/transcripts/oyc_sample.html
          if-no-files-found: error
          retention-days: 7
