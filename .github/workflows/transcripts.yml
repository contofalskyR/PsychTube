name: Fetch official transcripts
# Fetches the transcripts MIT OpenCourseWare and Open Yale Courses publish for lectures in the catalog
# (pipeline/transcripts.py plan -> pipeline/fetch_transcripts.py) and pushes the result to the `transcripts-data`
# branch (work/transcripts/), where the build machine can fetch it with git. Run by hand (workflow_dispatch):
# the build machine cannot reach those sites, this runner can.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N planned lectures (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python3 pipeline/transcripts.py plan
      - run: python3 pipeline/fetch_transcripts.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - name: Push results to the transcripts-data branch
        run: |
          git config user.name "transcripts workflow"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan transcripts-data
          git rm -rfq --cached .
          git add -f work/transcripts/checked.json work/transcripts/plan.json work/transcripts/text/ work/transcripts/oyc_sample.html || true
          git commit -qm "Transcripts fetched $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f origin transcripts-data
