name: Publish site to gh-pages
# GitHub Pages serves the gh-pages branch (enabled automatically when that branch first appeared).
# Every push to main republishes site/ there, so edit site/ or rebuild data.js and push.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          exclude_assets: hosted
          force_orphan: true
          commit_message: "Publish site from ${{ github.sha }}"
